<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViSiR-Parkour Live Demo</title>
  <script type="module" crossorigin src="./assets/index-YlbLmXXp.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B0lgQyli.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <div id="loading">
      <div class="loading-box">
        <div class="loading-title">ViSiR-Parkour</div>
        <div id="loading-text">Loading…</div>
        <div class="bar"><div id="loading-bar"></div></div>
      </div>
    </div>

    <div id="hud" class="panel">
      <div class="hud-title">ViSiR-Parkour <span>· live in your browser</span></div>
      <div id="section">—</div>
      <div class="bar"><div id="progress"></div></div>
      <div id="status"></div>
    </div>

    <div id="depth" class="panel">
      <div class="depth-cam"><canvas id="depth-fwd" width="64" height="48"></canvas><span>Forward depth</span></div>
      <div class="depth-cam"><canvas id="depth-down" width="64" height="48"></canvas><span>Down depth</span></div>
    </div>

    <div id="help" class="panel">
      <div class="help-lead">Just hold <b>W</b> or <b>↑</b> — the robot keeps itself on course.</div>
      <b>A/D</b> or <b>←/→</b> turn if needed &nbsp;·&nbsp; <b>Space</b> pause &nbsp;·&nbsp; <b>R</b> reset &nbsp;·&nbsp; drag the robot to push it
    </div>

    <div id="touch">
      <button id="btn-pause" aria-label="Pause">❚❚</button>
      <button id="btn-reset" aria-label="Reset">⟲</button>
      <button data-key="left" aria-label="Turn left">◀</button>
      <button data-key="forward" aria-label="Walk forward">▲</button>
      <button data-key="right" aria-label="Turn right">▶</button>
    </div>
  </div>
</body>
</html>
